name: Check Vercel connection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-vercel.yml
      - scripts/check-vercel.py

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose Vercel connection without deploying
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: python3 scripts/check-vercel.py
