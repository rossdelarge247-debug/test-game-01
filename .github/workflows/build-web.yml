name: Validate and build web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: stable

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Godot downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Install Godot and export templates
        run: bash scripts/install-godot.sh

      - name: Add Godot to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate project, movement and combat
        run: bash scripts/validate.sh

      - name: Export web build
        run: bash scripts/export-web.sh

      - name: Set up Node for browser validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.58.0
          npx playwright install --with-deps chromium

      - name: Check exported game in Chromium
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory build/web > build/validation/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/web_smoke.mjs

      - name: Upload validation logs and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-validation-${{ github.sha }}
          path: build/validation/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload downloadable web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: build/web/
          if-no-files-found: error
          retention-days: 14
